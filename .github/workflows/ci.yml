name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  api:
    name: API - compilar y probar
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # verify = compila + pruebas unitarias (surefire) + integracion con Testcontainers (failsafe) + JaCoCo
      - name: Compilar y ejecutar pruebas
        run: ./mvnw -B -ntp verify

      - name: Publicar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-jacoco
          path: api/target/site/jacoco/
          retention-days: 14
